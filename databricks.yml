# This is a Declarative Automation Bundle definition for hardware_data_pipeline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: hardware_data_pipeline
  uuid: cb46f13b-0434-4fb9-ae97-14423c303aa0

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405617403407544.4.azuredatabricks.net
    variables:
      catalog: abd_personal_projects
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://adb-7405617403407544.4.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/cmarvel@umich.edu to make sure we only have a single copy.
      root_path: /Workspace/Users/cmarvel@umich.edu/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: abd_personal_projects
      schema: prod
    permissions:
      - user_name: cmarvel@umich.edu
        level: CAN_MANAGE
