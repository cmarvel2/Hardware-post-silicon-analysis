[project]
name = "hardware_data_pipeline"
version = "0.0.1"
authors = [{ name = "cmarvel@umich.edu" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "azure-identity>=1.25.3",
    "azure-storage-blob>=12.30.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "pythonnet>=3.1.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/local_data_collection",
    "src/databricks_pipeline",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    "src",
]
