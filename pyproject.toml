[project]
name = "hardware_data_pipeline"
version = "0.0.1"
authors = [{ name = "cmarvel@umich.edu" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
    "azure-identity>=1.25.3",
    "azure-storage-blob>=12.30.0",
    "dotenv>=0.9.9",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pythonnet>=3.1.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
]

[project.scripts]
main = "local_data_collection.sensor_polling.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_data_collection"]

[tool.ruff]
line-length = 120
